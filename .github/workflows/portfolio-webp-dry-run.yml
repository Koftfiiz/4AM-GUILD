name: Portfolio image WebP — Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-webp-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Inspect and estimate WebP savings (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install pinned dependencies
        working-directory: tools/portfolio-image-migration
        run: npm install --no-save --no-package-lock --ignore-scripts=false --no-audit --no-fund @supabase/supabase-js@2.81.1 sharp@0.34.5

      - name: Run read-only dry run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: tools/portfolio-image-migration
        run: node dry-run.mjs

      - name: Upload dry-run report
        if: always() && hashFiles('tools/portfolio-image-migration/portfolio-webp-dry-run-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-webp-dry-run-report
          path: tools/portfolio-image-migration/portfolio-webp-dry-run-report.json
          if-no-files-found: warn
          retention-days: 14
