<!-- ===== เกมเป็ดแข่ง: วางโค้ดทั้งก้อนนี้ลงในหน้าเว็บไซต์ (HTML / Custom HTML block) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
#duck-race-root{--bg:#dfeef6;--card:#fff;--tx:#17324a;--mut:#5b7186;--ac:#3aa51f;--bd:#c3d6e3;}#duck-race-root @media (prefers-color-scheme:dark){#duck-race-root{--bg:#0d1f2b;--card:#17303f;--tx:#e8f1f7;--mut:#9fb5c5;--bd:#2c4a5d}}

#duck-race-root *{box-sizing:border-box}

#duck-race-root{color:var(--tx);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.4}#duck-race-root .stage{position:relative;max-width:1100px;margin:0 auto;container-type:inline-size;background:#000;user-select:none}#duck-race-root canvas{display:block;width:100%}#duck-race-root .stage button{font-family:inherit}#duck-race-root .ic{display:flex;position:absolute;left:0;top:0;background:#000}#duck-race-root .ic button{width:max(34px,4.9cqw);height:max(34px,4.9cqw);background:#000;color:#fff;border:0;font-size:max(17px,2.5cqw);cursor:pointer;padding:0}#duck-race-root #bShuf{position:absolute;left:0;top:max(34px,4.9cqw);background:#1a7f37;color:#fff;border:0;font-size:max(9px,1.25cqw);padding:3px 8px;cursor:pointer;border-radius:0 0 6px 0}#duck-race-root .ctl{position:absolute;left:max(70px,16cqw);top:1.6cqw;display:flex;flex-direction:column;align-items:flex-start;gap:max(2px,.8cqw)}#duck-race-root .ctl button{background:none;border:0;color:#fff;font-size:max(13px,2.3cqw);cursor:pointer;padding:0;font-family:Arial,sans-serif}#duck-race-root .ctl .sm{font-size:max(10px,1.4cqw);opacity:.8}#duck-race-root .clock{position:absolute;left:31.5cqw;top:1cqw;width:37cqw;text-align:center;background:#e8e8ff;border:.45cqw solid #333;border-radius:1.4cqw;font:max(22px,8.2cqw)/1.25 Arial,sans-serif;color:#000;box-shadow:0 2px 0 #0003}#duck-race-root .again{position:absolute;left:max(40px,5.5cqw);top:3px;background:#fff;border:3px solid #000;border-radius:12px;padding:5px;font-size:max(9px,1.15cqw);color:#000;z-index:3;width:max(120px,17cqw)}#duck-race-root .again .rm{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:4px}#duck-race-root .again .rm button{border:0;background:none;font-size:1.6em;cursor:pointer;color:#d00;padding:0;line-height:1}#duck-race-root .again .rm button.on{color:#1a9a1a}#duck-race-root #bAgain{width:100%;background:#5cc81a;border:2px solid #2d7a05;border-radius:8px;color:#fff;font-weight:800;font-size:1.5em;padding:3px;cursor:pointer}#duck-race-root #trophy{position:absolute;right:2cqw;bottom:2cqw;width:max(44px,8cqw);height:max(44px,8cqw);border-radius:50%;background:#000;border:3px solid #fff;font-size:max(22px,4cqw);cursor:pointer;z-index:3}#duck-race-root .hide{display:none!important}#duck-race-root .modal{position:fixed;inset:0;background:rgba(5,15,25,.7);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}#duck-race-root .mc{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:18px;width:min(520px,100%);max-height:100%;overflow:auto}#duck-race-root .mc h2{margin:0;font-size:1.3rem}#duck-race-root .settings-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}#duck-race-root .settings-close{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border:1px solid var(--bd);border-radius:50%;background:rgba(220,40,55,.12);color:#d62828;font:700 28px/1 Arial,sans-serif;cursor:pointer;transition:transform .18s,background .18s}#duck-race-root .settings-close:hover{transform:rotate(90deg);background:rgba(220,40,55,.22)}#duck-race-root .tabs{display:flex;gap:8px;margin:12px 0}#duck-race-root .tab{flex:1;padding:9px;border:2px solid var(--bd);background:transparent;color:var(--tx);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}#duck-race-root .tab.on{background:var(--ac);border-color:var(--ac);color:#fff}#duck-race-root label{display:block;font-weight:600;margin:12px 0 6px}#duck-race-root .row{display:flex;align-items:center;gap:10px}#duck-race-root .tm{display:flex;gap:8px}#duck-race-root .tm div{flex:1;text-align:center;font-size:.85rem;color:var(--mut)}#duck-race-root input[type=range]{flex:1;accent-color:var(--ac)}#duck-race-root input[type=number],#duck-race-root textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:inherit}#duck-race-root .tm input{width:100%;text-align:center;font-size:1.5rem;font-weight:800}#duck-race-root #cnt{width:84px;text-align:center;font-weight:800}#duck-race-root textarea{width:100%;min-height:170px;resize:vertical}#duck-race-root .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}#duck-race-root .chip,#duck-race-root .btn{padding:6px 12px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:999px;font:inherit;cursor:pointer;font-size:.9rem}#duck-race-root .hint{color:var(--mut);font-size:.88rem;margin-top:6px}#duck-race-root .go{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}#duck-race-root .list{border:1px solid var(--bd);border-radius:10px;margin:10px 0;max-height:55vh;overflow:auto}#duck-race-root .list div{display:flex;gap:10px;padding:6px 12px;border-bottom:1px solid var(--bd)}#duck-race-root .list b{width:2.4em;color:var(--mut)}#duck-race-root .list span:last-child{margin-left:auto;color:var(--mut)}

/* Modern arcade controls */
#duck-race-root .stage{overflow:hidden;border:1px solid rgba(255,255,255,.28);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.25);background:#071b29}
#duck-race-root .ic{gap:6px;left:12px;top:12px;background:rgba(5,15,27,.58);padding:7px;border:1px solid rgba(255,255,255,.18);border-radius:14px;backdrop-filter:blur(12px);z-index:5}
#duck-race-root .ic button{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:19px;transition:transform .18s,background .18s}
#duck-race-root .ic button:hover{transform:translateY(-2px);background:rgba(255,255,255,.22)}
#duck-race-root #bShuf{left:12px;top:67px;border-radius:10px;padding:8px 12px;background:linear-gradient(135deg,#167b51,#0c493d);border:1px solid rgba(163,255,211,.35);font-size:12px;font-weight:800;box-shadow:0 5px 15px #0018}
#duck-race-root .ctl{left:12px;top:auto;bottom:14px;flex-direction:row;align-items:center;gap:9px;padding:8px;background:rgba(5,15,27,.62);border:1px solid rgba(255,255,255,.18);border-radius:15px;backdrop-filter:blur(12px);z-index:5}
#duck-race-root .ctl button{min-width:94px;padding:10px 17px;border-radius:11px;border:1px solid rgba(255,255,255,.22);font-size:14px;font-weight:900;letter-spacing:.3px;background:linear-gradient(135deg,#263c50,#172a3c);box-shadow:0 4px 12px #0005;transition:transform .16s,filter .16s}
#duck-race-root .ctl button:hover{transform:translateY(-2px);filter:brightness(1.18)}
#duck-race-root #bGo{background:linear-gradient(135deg,#ff4c58,#bd1735);border-color:#ff9aa2;color:#fff}
#duck-race-root #bClr{background:linear-gradient(135deg,#64748b,#334155);color:#fff}
#duck-race-root .ctl #bSkip{min-width:auto;font-size:11px;padding:9px 11px;color:#dbeafe}
#duck-race-root .clock{left:50%;top:12px;transform:translateX(-50%);width:auto;min-width:190px;padding:8px 22px;border:1px solid rgba(255,255,255,.4);border-radius:16px;background:linear-gradient(135deg,rgba(9,24,42,.88),rgba(17,45,65,.78));color:#fff;font:800 clamp(22px,4.4cqw,48px)/1.15 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;box-shadow:0 8px 24px #0018,inset 0 1px 0 #ffffff35;backdrop-filter:blur(14px);text-shadow:0 0 18px #67d9ff75;z-index:4}
#duck-race-root .again{border-radius:14px;border:1px solid #ffffff55;background:rgba(10,24,40,.88);color:#fff;backdrop-filter:blur(12px)}
#duck-race-root #bAgain{background:linear-gradient(135deg,#84cc16,#3f9c24);border:1px solid #c8ff82}
#duck-race-root #trophy{border:1px solid #ffe8a1;background:linear-gradient(145deg,#f7b733,#bd7410);box-shadow:0 8px 22px #0007}
@media(max-width:600px){#duck-race-root .ctl{left:8px;bottom:8px;gap:5px;padding:5px}#duck-race-root .ctl button{min-width:70px;padding:9px 10px;font-size:12px}#duck-race-root .clock{top:62px;min-width:145px;padding:6px 12px;font-size:clamp(20px,6cqw,32px)}#duck-race-root .ic{left:8px;top:8px;padding:5px}#duck-race-root .ic button{width:32px;height:32px}#duck-race-root #bShuf{top:53px;left:8px}}

</style>
<div id="duck-race-root">
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="ic"><button id="bSet" title="ตั้งค่า">⚙</button><button id="bMus" title="เปิด/ปิดเพลง (เพลงเริ่มเมื่อกด Start)">♫✕</button><button id="bBell" title="เสียงระฆัง">🔔✕</button></div>
  <button id="bShuf">🔀 Shuffle Characters</button>
  <div class="ctl"><button id="bGo">▶ START</button><button id="bClr">↺ CLEAR</button><button id="bSkip" class="sm">ข้ามไปจบ</button></div>
  <div class="clock" id="clk">00:00:30</div>
  <div class="again hide" id="again"><div class="rm"><span>Remove winner from next race?</span><button id="rm" title="ตัดผู้ชนะออกจากรอบถัดไป">✕</button></div><button id="bAgain">Race Again?</button></div>
  <button id="trophy" class="hide" title="ผลการแข่ง">🏆</button>
</div>

<div class="modal" id="setM">
  <div class="mc">
    <div class="settings-head"><h2>⚙ ตั้งค่าเกม</h2><button type="button" class="settings-close" id="setX" aria-label="ปิดหน้าตั้งค่า" title="ปิด">×</button></div>
    <label>ตั้งเวลา (ตั้งได้ตั้งแต่ 1 วินาทีถึงหลักชั่วโมง)</label>
    <div class="tm">
      <div>ชั่วโมง<input type="number" id="th" min="0" max="99" value="0"></div>
      <div>นาที<input type="number" id="tmn" min="0" value="0"></div>
      <div>วินาที<input type="number" id="ts" min="0" value="30"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="tabs"><button class="tab on" id="tN">Numbers (ตามจำนวน)</button><button class="tab" id="tM">Names (กรอกรายชื่อ)</button></div>
    <div id="pN">
      <label for="cnt">จำนวนเป็ด (สูงสุด 120 ตัว)</label>
      <div class="row"><input type="range" id="rng" min="2" max="120" value="10"><input type="number" id="cnt" min="2" max="120" value="10"></div>
    </div>
    <div id="pM" class="hide">
      <label for="names">รายชื่อ (ชื่อละ 1 บรรทัด)</label>
      <textarea id="names" placeholder="สมชาย&#10;สมหญิง&#10;มานี&#10;..."></textarea>
      <div class="hint" id="nh">0 รายชื่อ</div>
    </div>
    <button class="go" id="save">บันทึกและเข้าเกม</button>
  </div>
</div>

<div class="modal hide" id="resM">
  <div class="mc"><h2 id="winT"></h2><div class="list" id="list"></div><button class="go" id="resX" style="margin:0">ปิด</button></div>
</div>
</div>
<script>
(function(){

const root=document.getElementById('duck-race-root');
const $=id=>root.querySelector('#'+id);
const MUSIC_URL='/duck-race/audio/duck-race-music.mp3';/* Custom Duck Race background music */
const cv=$('cv'),cx=cv.getContext('2d');
const MAXN=120,SL=.42,NEED=20;
let W=1000,H=566,DPR=1,D=2000,mode='num',roster=[],ducks=[],rmWin=false,musOn=false,bellOn=false;
let S={st:'idle',t:0,T:30,sc:1,cam:0,last:0,fin:false};

/* ---------- costumes (every duck is unique) ---------- */
const BODY=['#ffd84a','#e63946','#f78fb3','#8e44ad','#2fcf3a','#a7d129','#2f6fe0','#6ec6ff','#ff7a00','#14a8a0','#f4f4f4','#4a4a4a','#8d5524','#9aa5b1','#e0409a','#fff08a'];
const COL=['#d62828','#2f6fe0','#2fcf3a','#8e44ad','#ff7a00','#f78fb3','#14a8a0','#151515','#ffffff','#f4b400','#6ec6ff','#8d5524'];
const HATS=['chef','top','crown','hard','helmet','cap','santa','pirate','guard','party','beanie','cowboy'],WIGS=['afro','mohawk','long','curly','pigtail','bob'];
const GL=['round','shades','star','heart','goggles','monocle'],NK=['bow','scarf'],SH=['solid','stripe','dots','sailor','vest','check'],SUITS=['straw','bee','dino','uni','snow','mask'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function genCo(){
  const co={};
  if(Math.random()<.28){co.su=rnd(SUITS);co.c=rnd(COL);
    co.bc={straw:'#d62828',bee:'#ffd84a',dino:co.c,uni:rnd(['#ffffff','#f78fb3','#c7a6ff','#a8e6ff']),snow:'#eaf8ff',mask:rnd(BODY)}[co.su]}
  else{co.bc=rnd(BODY);if(Math.random()<.2)co.st='dots';
    const noH=Math.random()<.12;
    if(!noH){co.h=rnd(HATS.concat(WIGS,WIGS));co.hc=rnd(COL)}
    if(noH||Math.random()<.75){co.sh=rnd(SH);co.s1=rnd(COL.filter(x=>x!==co.bc));co.s2=rnd(COL.filter(x=>x!==co.s1));
      if(co.sh==='sailor')co.s1='#ffffff';if(co.sh==='solid')delete co.s2}}
  if(Math.random()<.6||(!co.h&&!co.su))co.gl=rnd(GL);
  if(Math.random()<.4){co.nk=rnd(NK);co.nc=rnd(COL)}
  return co;
}
function assignCo(list){const used=new Set();list.forEach(r=>{let co,n=0;do{co=genCo()}while(used.has(JSON.stringify(co))&&++n<800);used.add(JSON.stringify(co));r.co=co})}

/* ---------- duck drawing: fluffy front-facing duck (unit coords, width = 1) ---------- */
const shade=(h,f)=>{const n=parseInt(h.slice(1),16),m=v=>Math.max(0,Math.min(255,Math.round(v*f)));return '#'+[n>>16,n>>8&255,n&255].map(v=>m(v).toString(16).padStart(2,'0')).join('')};
const PI=Math.PI,PH=new Path2D(),PB=new Path2D(),PD=new Path2D();
PH.ellipse(0,-.38,.39,.34,0,0,7);PH.moveTo(.36,.12);PH.ellipse(0,.12,.36,.38,0,0,7);
PB.ellipse(0,.12,.36,.38,0,0,7);PD.ellipse(0,-.38,.39,.34,0,0,7);
function drawDuck(k,x,y,s,t){
  const c=cx,co=k.r.co,bc=co.bc,hc=co.hc,lw=.02,ol=co.ol||(co.ol=shade(bc,.6)),INK='#2b2100';
  const FS=(col,o)=>{c.fillStyle=col;c.fill();c.lineWidth=lw;c.strokeStyle=o||INK;c.stroke()};
  const circ=(a,b,r,col,o)=>{c.beginPath();c.arc(a,b,r,0,7);FS(col,o)};
  const R=(a,b,w,h,col)=>{c.beginPath();c.rect(a,b,w,h);FS(col)};
  const poly=(pts,col,o)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();FS(col,o)};
  const star=(a,b,Ro,ri,col)=>{c.beginPath();for(let i=0;i<10;i++){const rr=i%2?ri:Ro,an=-PI/2+i*PI/5;c.lineTo(a+rr*Math.cos(an),b+rr*Math.sin(an))}c.closePath();FS(col)};
  const heart=(a,b,z,col)=>{c.beginPath();c.moveTo(a,b+z);c.bezierCurveTo(a-z*1.4,b-z*.2,a-z*.6,b-z*1.2,a,b-z*.5);c.bezierCurveTo(a+z*.6,b-z*1.2,a+z*1.4,b-z*.2,a,b+z);FS(col)};
  const line=(a,b,d,e,col,w)=>{c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.lineWidth=w||lw;c.strokeStyle=col||INK;c.stroke()};
  const tired=k.mode==='tired',boost=k.mode==='boost',cycle=t*9+k.ph;
  const bob=Math.sin(cycle)*.045;
  const yb=y+Math.sin(t*4+k.ph)*s*.03+bob*s;
  c.save();c.translate(x,yb);c.rotate(Math.sin(t*3+k.ph)*.035+(boost?-.06:0));c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  // Animated swim wake
  c.fillStyle='rgba(255,255,255,.24)';c.beginPath();c.ellipse(0,.58,.67,.13+Math.abs(Math.sin(cycle))*.025,0,0,7);c.fill();
  for(let z=0;z<3;z++){c.strokeStyle='rgba(230,255,255,'+(.42-z*.1)+')';c.lineWidth=.018;c.beginPath();c.ellipse(-.53-z*.16,.57,.16+z*.05,.045,0,0,7);c.stroke()}
  // wigs behind the head
  if(co.h==='afro')circ(0,-.52,.5,hc,shade(hc,.6));
  if(co.h==='bob'){c.beginPath();c.ellipse(0,-.35,.46,.42,0,0,7);FS(hc,shade(hc,.6))}
  if(co.h==='long'){c.beginPath();c.ellipse(0,-.2,.46,.55,0,0,7);FS(hc,shade(hc,.6))}
  if(co.h==='pigtail'){circ(-.44,-.45,.12,hc,shade(hc,.6));circ(.44,-.45,.12,hc,shade(hc,.6));circ(-.47,-.28,.1,hc,shade(hc,.6));circ(.47,-.28,.1,hc,shade(hc,.6))}
  if(co.h==='curly')for(let i=0;i<10;i++){const a=PI*.9+i*PI*.133;circ(.46*Math.cos(a),-.38+.42*Math.sin(a),.1,hc,shade(hc,.6))}
  if(co.su==='bee'){[-1,1].forEach(d=>{c.beginPath();c.ellipse(d*.3,-.15,.1,.26,d*.5,0,7);FS('rgba(255,255,255,.85)','#7a7a7a')})}
  // Feet kick back and forth as the duck swims
  const fp=Math.sin(cycle)*.075;
  [-1,1].forEach(d=>{c.save();c.translate(d*.17,.52+fp*d);c.rotate(fp*d*3);c.beginPath();c.ellipse(0,0,.16,.045,0,0,7);FS('#f0a020','#8a5a00');[-.07,0,.07].forEach(o=>circ(o,.035,.03,'#f0a020','#8a5a00'));c.restore()});
  // Wings paddle faster during boost and droop while tired
  [-1,1].forEach(d=>{c.save();c.translate(d*.43,.12);c.rotate(tired?d*.55:Math.sin(cycle*(boost?2.1:1.1))* (boost?.9:.48)*d);c.beginPath();c.ellipse(0,0,.12,.22,0,0,7);FS(bc,ol);c.restore()});
  // body + head
  c.lineWidth=lw*2;c.strokeStyle=ol;c.stroke(PH);c.fillStyle=bc;c.fill(PH);
  c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.ellipse(-.12,-.56,.2,.09,-.3,0,7);c.fill();
  c.beginPath();c.ellipse(0,.24,.25,.24,0,0,7);c.fill();
  c.save();c.clip(PH);
  if(co.st==='dots'){c.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<7;i++)for(let j=0;j<7;j++){c.beginPath();c.arc(-.36+i*.12+(j%2)*.06,-.62+j*.17,.035,0,7);c.fill()}}
  if(co.su==='straw'){c.fillStyle='#ffe066';for(let i=0;i<9;i++)for(let j=0;j<7;j++){c.beginPath();c.ellipse(-.4+i*.1+(j%2)*.05,-.62+j*.19,.018,.03,0,0,7);c.fill()}}
  if(co.su==='mask'){c.save();c.clip(PD);c.fillStyle=co.c;c.fillRect(-.5,-.8,1,.5);c.restore();star(0,-.6,.1,.045,'#fff')}
  c.restore();
  if(co.su==='bee'){c.save();c.clip(PB);c.fillStyle='#151515';[.02,.2,.38].forEach(v=>c.fillRect(-.5,v,1,.08));c.restore()}

function frame(now){

    S.t+=dt;
    const base=D/Math.max(1,S.T);
    ducks.forEach(k=>{
      if(!k.mode||k.mode==='normal'){
        k.eventIn-=dt;
        if(k.eventIn<=0){k.mode=Math.random()<.58?'tired':'boost';k.modeLeft=k.mode==='tired'?2.2+Math.random()*3.4:1.1+Math.random()*1.5;k.eventIn=5+Math.random()*8;k.fx=k.mode==='boost'?(Math.random()<.5?'fart':'rocket'):'sweat'}
      }else{
        k.modeLeft-=dt;
        if(k.modeLeft<=0){k.mode='normal';k.eventIn=2.5+Math.random()*5;k.fx=''}
      }
      const mult=k.mode==='tired'?.42:k.mode==='boost'?2.25:1;
      k.offset=Math.max(-D*.12,Math.min(D*.12,(k.offset||0)+base*(mult-1)*dt));

  S={st:'idle',t:0,T:cfg.T,sc:1,cam:0,last:performance.now(),fin:false};

function stopMus(){clearInterval(mt);if(aud)aud.pause()}
function startMus(){
  if(MUSIC_URL){if(!aud){aud=new Audio(MUSIC_URL);aud.loop=true;aud.volume=.6}aud.play().catch(()=>{});return}
  ac();if(!AC)return;
  mt=setInterval(()=>{if(S.st!=='run')return;const bar=Math.floor(mi/8)%4,n=mi%8;
    tone(ROOT[bar]*(n%4===2?2:1),.17,'triangle',.12);tone(LEAD[bar][n],.15,'square',.035);if(n%2)tone(6000,.03,'square',.012);mi++},190)}
$('bMus').onclick=()=>{musOn=!musOn;$('bMus').textContent=musOn?'♫ ON':'♫ OFF';if(!musOn)stopMus();};
$('bBell').onclick=()=>{bellOn=!bellOn;$('bBell').textContent=bellOn?'🔔 ON':'🔔 OFF';ac();if(bellOn)tone(880,.4,'sine',.15)};

/* ---------- settings ---------- */
let cfg={T:30};
function setMode(m){mode=m;$('tN').classList.toggle('on',m==='num');$('tM').classList.toggle('on',m==='names');$('pN').classList.toggle('hide',m!=='num');$('pM').classList.toggle('hide',m!=='names')}
$('tN').onclick=()=>setMode('num');$('tM').onclick=()=>setMode('names');
const clampN=v=>Math.max(2,Math.min(MAXN,Math.round(+v)||2));
$('rng').oninput=e=>$('cnt').value=e.target.value;
$('cnt').onchange=e=>{e.target.value=clampN(e.target.value);$('rng').value=e.target.value};
const getNames=()=>$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
$('names').oninput=()=>{const n=getNames().length;$('nh').textContent=n+' รายชื่อ'+(n>MAXN?' (ใช้เฉพาะ '+MAXN+' รายชื่อแรก)':n<2?' (ต้องมีอย่างน้อย 2)':'')};
[[10,'10 วิ'],[30,'30 วิ'],[60,'1 นาที'],[300,'5 นาที'],[600,'10 นาที'],[1800,'30 นาที'],[3600,'1 ชั่วโมง']].forEach(([t,l])=>{
  const b=document.createElement('button');b.className='chip';b.textContent=l;
  b.onclick=()=>{$('th').value=Math.floor(t/3600);$('tmn').value=Math.floor(t%3600/60);$('ts').value=t%60};$('chips').appendChild(b)});
function openSet(){$('setM').classList.remove('hide')}
function closeSet(){$('setM').classList.add('hide')}
$('bSet').onclick=openSet;
$('setX').onclick=closeSet;
$('save').onclick=()=>{
  const T=Math.round((+$('th').value||0)*3600+(+$('tmn').value||0)*60+(+$('ts').value||0));
  if(T<1){alert('กรุณาตั้งเวลาอย่างน้อย 1 วินาที');return}
  if(T>99*3600+3599){alert('เวลามากสุด 99 ชั่วโมง');return}
  let labels;
  if(mode==='num')labels=Array.from({length:clampN($('cnt').value)},(_,i)=>String(i+1));
  else{labels=getNames().slice(0,MAXN);if(labels.length<2){alert('กรุณากรอกรายชื่ออย่างน้อย 2 รายชื่อ');return}}
  cfg={T};roster=labels.map(l=>({label:l}));assignCo(roster);
  $('setM').classList.add('hide');reset();
};
size();roster=Array.from({length:10},(_,i)=>({label:String(i+1)}));assignCo(roster);reset();
requestAnimationFrame(frame);

})();
