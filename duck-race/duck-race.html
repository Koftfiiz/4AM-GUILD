/* Full-size game canvas inside the existing 4AM GUILD sidebar layout */
html,body{margin:0!important;width:100%;height:100%;overflow:hidden}

/* Initial setup screen: keep the race canvas and all ducks hidden until settings are saved. */

  overflow:hidden;

  padding:clamp(128px,19vh,176px) 14px 24px;

<script>
(function(){

const root=document.getElementById('duck-race-root');
const $=id=>root.querySelector('#'+id);
const MUSIC_URL='/duck-race/audio/duck-race-music.mp3';/* Custom Duck Race background music */
const cv=$('cv'),cx=cv.getContext('2d');
const MAXN=120,SL=.42,NEED=20;
let W=1000,H=566,DPR=1,D=2000,mode='num',roster=[],ducks=[],rmWin=false,musOn=false,bellOn=false;
let S={st:'idle',t:0,T:30,sc:1,cam:0,last:0,fin:false};

/* ---------- costumes (every duck is unique) ---------- */
const BODY=['#ffd84a','#e63946','#f78fb3','#8e44ad','#2fcf3a','#a7d129','#2f6fe0','#6ec6ff','#ff7a00','#14a8a0','#f4f4f4','#4a4a4a','#8d5524','#9aa5b1','#e0409a','#fff08a'];
const COL=['#d62828','#2f6fe0','#2fcf3a','#8e44ad','#ff7a00','#f78fb3','#14a8a0','#151515','#ffffff','#f4b400','#6ec6ff','#8d5524'];
const HATS=['chef','top','crown','hard','helmet','cap','santa','pirate','guard','party','beanie','cowboy'],WIGS=['afro','mohawk','long','curly','pigtail','bob'];
const GL=['round','shades','star','heart','goggles','monocle'],NK=['bow','scarf'],SH=['solid','stripe','dots','sailor','vest','check'],SUITS=['straw','bee','dino','uni','snow','mask'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function genCo(){
  const co={};
  if(Math.random()<.28){co.su=rnd(SUITS);co.c=rnd(COL);
    co.bc={straw:'#d62828',bee:'#ffd84a',dino:co.c,uni:rnd(['#ffffff','#f78fb3','#c7a6ff','#a8e6ff']),snow:'#eaf8ff',mask:rnd(BODY)}[co.su]}
  else{co.bc=rnd(BODY);if(Math.random()<.2)co.st='dots';
    const noH=Math.random()<.12;
    if(!noH){co.h=rnd(HATS.concat(WIGS,WIGS));co.hc=rnd(COL)}
    if(noH||Math.random()<.75){co.sh=rnd(SH);co.s1=rnd(COL.filter(x=>x!==co.bc));co.s2=rnd(COL.filter(x=>x!==co.s1));
      if(co.sh==='sailor')co.s1='#ffffff';if(co.sh==='solid')delete co.s2}}
  if(Math.random()<.6||(!co.h&&!co.su))co.gl=rnd(GL);
  if(Math.random()<.4){co.nk=rnd(NK);co.nc=rnd(COL)}
  return co;
}
function assignCo(list){const used=new Set();list.forEach(r=>{let co,n=0;do{co=genCo()}while(used.has(JSON.stringify(co))&&++n<800);used.add(JSON.stringify(co));r.co=co})}

/* ---------- duck drawing: fluffy front-facing duck (unit coords, width = 1) ---------- */
const shade=(h,f)=>{const n=parseInt(h.slice(1),16),m=v=>Math.max(0,Math.min(255,Math.round(v*f)));return '#'+[n>>16,n>>8&255,n&255].map(v=>m(v).toString(16).padStart(2,'0')).join('')};
const PI=Math.PI,PH=new Path2D(),PB=new Path2D(),PD=new Path2D();
PH.ellipse(0,-.38,.39,.34,0,0,7);PH.moveTo(.36,.12);PH.ellipse(0,.12,.36,.38,0,0,7);
PB.ellipse(0,.12,.36,.38,0,0,7);PD.ellipse(0,-.38,.39,.34,0,0,7);
function drawDuck(k,x,y,s,t){
  const c=cx,co=k.r.co,bc=co.bc,hc=co.hc,lw=.02,ol=co.ol||(co.ol=shade(bc,.6)),INK='#2b2100';
  const FS=(col,o)=>{c.fillStyle=col;c.fill();c.lineWidth=lw;c.strokeStyle=o||INK;c.stroke()};
  const circ=(a,b,r,col,o)=>{c.beginPath();c.arc(a,b,r,0,7);FS(col,o)};
  const R=(a,b,w,h,col)=>{c.beginPath();c.rect(a,b,w,h);FS(col)};
  const poly=(pts,col,o)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();FS(col,o)};
  const star=(a,b,Ro,ri,col)=>{c.beginPath();for(let i=0;i<10;i++){const rr=i%2?ri:Ro,an=-PI/2+i*PI/5;c.lineTo(a+rr*Math.cos(an),b+rr*Math.sin(an))}c.closePath();FS(col)};
  const heart=(a,b,z,col)=>{c.beginPath();c.moveTo(a,b+z);c.bezierCurveTo(a-z*1.4,b-z*.2,a-z*.6,b-z*1.2,a,b-z*.5);c.bezierCurveTo(a+z*.6,b-z*1.2,a+z*1.4,b-z*.2,a,b+z);FS(col)};
  const line=(a,b,d,e,col,w)=>{c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.lineWidth=w||lw;c.strokeStyle=col||INK;c.stroke()};
  const yb=y+Math.sin(t*4+k.ph)*s*.03+Math.sin(t*9+k.ph)*s*.045;
  c.save();c.translate(x,yb);c.rotate(Math.sin(t*3+k.ph)*.05);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.ellipse(0,.56,.62,.12,0,0,7);c.fill();for(let z=0;z<3;z++){c.strokeStyle='rgba(230,255,255,'+(.42-z*.1)+')';c.lineWidth=.018;c.beginPath();c.ellipse(-.52-z*.15,.57,.16+z*.05,.045,0,0,7);c.stroke()}
  // wigs behind the head
  if(co.h==='afro')circ(0,-.52,.5,hc,shade(hc,.6));
  if(co.h==='bob'){c.beginPath();c.ellipse(0,-.35,.46,.42,0,0,7);FS(hc,shade(hc,.6))}
  if(co.h==='long'){c.beginPath();c.ellipse(0,-.2,.46,.55,0,0,7);FS(hc,shade(hc,.6))}
  if(co.h==='pigtail'){circ(-.44,-.45,.12,hc,shade(hc,.6));circ(.44,-.45,.12,hc,shade(hc,.6));circ(-.47,-.28,.1,hc,shade(hc,.6));circ(.47,-.28,.1,hc,shade(hc,.6))}
  if(co.h==='curly')for(let i=0;i<10;i++){const a=PI*.9+i*PI*.133;circ(.46*Math.cos(a),-.38+.42*Math.sin(a),.1,hc,shade(hc,.6))}
  if(co.su==='bee'){[-1,1].forEach(d=>{c.beginPath();c.ellipse(d*.3,-.15,.1,.26,d*.5,0,7);FS('rgba(255,255,255,.85)','#7a7a7a')})}
  // feet
  const fp=Math.sin(t*9+k.ph)*.075;
  [-1,1].forEach(d=>{c.beginPath();c.ellipse(d*.17,.52+fp*d,.14,.055,0,0,7);FS('#f0a020','#8a5a00');[-.07,0,.07].forEach(o=>circ(d*.17+o,.56+fp*d,.03,'#f0a020','#8a5a00'))});
  // wings
  [-1,1].forEach(d=>{c.save();c.translate(d*.43,.12);c.rotate(k.mode==='tired'?d*.55:Math.sin(t*9+k.ph*(k.mode==='boost'?2:1))*(k.mode==='boost'?.9:.48)*d);c.beginPath();c.ellipse(0,0,.12,.22,0,0,7);FS(bc,ol);c.restore()});
  // body + head

  c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.ellipse(-.12,-.56,.2,.09,-.3,0,7);c.fill();

const hms=n=>{n=Math.max(0,Math.ceil(n));const p=v=>String(v).padStart(2,'0');return p(Math.floor(n/3600))+':'+p(Math.floor(n%3600/60))+':'+p(n%60)};

      const py=y+s*(.18+spread+Math.sin(phase*.28+i*1.31)*.11+age*.13);
      const radius=s*(.105+age*.25+(i%4)*.018);
      const alpha=.88*(1-age*.48);
      const g=c.createRadialGradient(px-radius*.18,py-radius*.2,radius*.025,px,py,radius);
      g.addColorStop(0,'rgba(15,72,13,'+alpha+')');
      g.addColorStop(.34,'rgba(25,112,19,'+(alpha*.98)+')');
      g.addColorStop(.68,'rgba(43,160,31,'+(alpha*.82)+')');
      g.addColorStop(.9,'rgba(74,190,48,'+(alpha*.48)+')');
      g.addColorStop(1,'rgba(86,210,53,0)');
      c.fillStyle=g;c.beginPath();c.arc(px,py,radius,0,Math.PI*2);c.fill();
    }
    // Curling smoke tongues merge the cloud into a single drifting plume.
    for(let j=0;j<9;j++){
      const p=(t*.48+j*.113+k.ph)%1;
      const px=x-s*(.38+p*1.05),py=y+s*(.12+(j-4)*.065+Math.sin(phase*.2+j)*.13);
      c.beginPath();c.moveTo(px,py);
      c.bezierCurveTo(px-s*.18,py-s*.2,px-s*.34,py+s*.2,px-s*.58,py-s*.07);
      c.strokeStyle='rgba(47,150,31,'+(.66*(1-p*.45))+')';
      c.lineWidth=s*(.045+(1-p)*.035);c.lineCap='round';c.stroke();
    }
  }else if(k.fx==='fire'){
    // Existing fire boost retained.
    c.globalCompositeOperation='lighter';
    for(let i=0;i<18;i++){const age=((t*2.2+i*.071+k.ph)%1),px=x-s*.38-age*s*.9,py=y+s*.35+Math.sin(phase+i*3)*s*.17;
      const r=s*(.035+(1-age)*.10),g=c.createRadialGradient(px,py,0,px,py,r*2.2);
      g.addColorStop(0,'rgba(255,245,155,.95)');g.addColorStop(.35,'rgba(255,128,35,.75)');g.addColorStop(1,'rgba(255,55,20,0)');
      c.fillStyle=g;c.beginPath();c.arc(px,py,r*2.2,0,Math.PI*2);c.fill();}
  }else{
    // Flash and sonic use the same premium layered energy plume language as fire,
    // but with their own color identity and flowing comet-like trails.
    c.globalCompositeOperation='lighter';
    const flash=k.fx==='flash';
    const colors=flash
      ? ['rgba(255,246,248,.98)','rgba(255,63,91,.88)','rgba(174,12,49,0)']
      : ['rgba(231,252,255,.98)','rgba(65,190,255,.88)','rgba(25,94,220,0)'];
    for(let i=0;i<25;i++){
      const age=((t*(flash?2.1:1.65)+i*.057+k.ph)%1);
      const px=x-s*(.28+age*(flash?1.05:1.2));
      const py=y+s*(.12+Math.sin(phase*.65+i*1.7)*(.12+age*.12));
      const r=s*(.035+(1-age)*.105);
      const g=c.createRadialGradient(px,py,0,px,py,r*2.8);
      g.addColorStop(0,colors[0]);g.addColorStop(.36,colors[1]);g.addColorStop(1,colors[2]);
      c.fillStyle=g;c.beginPath();c.ellipse(px,py,r*1.45,r*2.15,Math.sin(phase+i)*.5,0,Math.PI*2);c.fill();
    }
    for(let lane=0;lane<4;lane++){
      const sway=Math.sin(phase*.55+lane*1.7)*s*.09;
      c.beginPath();c.moveTo(x-s*.2,y+s*(.08+lane*.045));
      c.bezierCurveTo(x-s*.48,y+s*(sway/s-.12+lane*.045),x-s*.78,y+s*(.2+lane*.035),x-s*1.28,y+s*(sway/s+.08+lane*.045));
      c.strokeStyle=lane===0?colors[0]:colors[1];
      c.globalAlpha=.9-lane*.13;c.lineWidth=s*(lane===0?.035:.075-lane*.009);
      c.shadowColor=flash?'#ff315d':'#36cfff';c.shadowBlur=s*.22;c.lineCap='round';c.stroke();
    }
    c.globalAlpha=1;c.shadowBlur=0;
    for(let i=0;i<14;i++){
      const p=(t*1.9+i*.079+k.ph)%1,px=x-s*(.25+p*1.15),py=y+s*(.1+Math.sin(p*15+i*2)*.24);
      const r=s*(.012+(i%3)*.012);
      c.fillStyle=i%2?colors[1]:colors[0];c.beginPath();c.arc(px,py,r,0,Math.PI*2);c.fill();
    }
  }
  c.globalCompositeOperation='source-over';c.globalAlpha=1;c.shadowBlur=0;c.restore();
}
function drawFatigueEffect(k,x,y,s,t){
  // Subtle sweat droplets and a heavier, slower bob; no emoji or text labels.
  const c=cx;c.save();c.fillStyle='rgba(155,225,255,.78)';
  for(let i=0;i<2;i++){const p=(t*1.15+i*.5+k.ph)%1,dx=(i?1:-1)*s*.27;
    c.globalAlpha=1-p*.65;c.beginPath();c.ellipse(x+dx+p*s*.08,y-s*.72+p*s*.25,s*.025,s*(.045+p*.025),-.35,0,Math.PI*2);c.fill();}
  c.restore();
}

function frame(now){
  const rawDt=Math.max(0,(now-S.last)/1000),dt=Math.min(.05,rawDt);S.last=now;
  if(S.st==='run'){
    S.t=Math.min(S.T,S.t+rawDt);
    const base=RACE_SPEED;
    if(!S.fin){
      // Each duck owns its pace, stamina, lane target and event clock.
      ducks.forEach(k=>{
        k.eventIn-=dt;
        k.laneChangeIn-=dt;
        if(k.laneChangeIn<=0){
          k.laneTarget=.08+Math.random()*.84;
          k.laneChangeIn=1.8+Math.random()*4.2;
        }
        if(k.eventIn<=0){
          const roll=Math.random();
          k.mode=roll<.57?'boost':roll<.82?'tired':'normal';
          k.modeLeft=k.mode==='boost'?1.0+Math.random()*1.7:k.mode==='tired'?1.4+Math.random()*2.6:.8+Math.random()*1.2;
          k.fx=k.mode==='boost'?rnd(['fart','flash','sonic','fire']):k.mode==='tired'?'sweat':'';
        }
        if(k.modeLeft>0){
          k.modeLeft-=dt;
          if(k.modeLeft<=0){
            k.mode='normal';k.fx='';
            k.eventIn=2.5+Math.random()*7.5;
          }
        }
        const wave=Math.sin(S.t*k.paceWave+k.ph)*k.paceSwing+
          Math.sin(S.t*.31+k.ph*1.7)*.035;
        const profile=k.profile==='sprinter'?(S.t<S.T*.28?.10:-.035):
          k.profile==='late'?(S.t>S.T*.62?.105:-.025):
          k.profile==='wild'?wave*1.65:wave*.55;
        const staminaFactor=.88+k.stamina*.12;
        const modeFactor=k.mode==='boost'?1.58:k.mode==='tired'?.57:1;
        const speed=base*(k.basePace+profile+wave*.45)*staminaFactor*modeFactor;
        k.offset=(k.offset||0)+(speed-base)*dt;
        const limit=Math.max(150,W*.46);
        k.offset=Math.max(-limit,Math.min(limit,k.offset));
        if(k.mode==='boost')k.stamina=Math.max(.25,k.stamina-.16*dt);
        else k.stamina=Math.min(1,k.stamina+(k.mode==='tired'?.12:.055)*dt);
        // Smooth, independent lane movement. Avoidance nudges targets rather than snapping positions.
        k.laneY+=(k.laneTarget-k.laneY)*(1-Math.exp(-dt*1.15));
      });
      // Local separation: nearby ducks gently choose opposite vertical space.
      const minGap=Math.max(25,duckSize()*.88),lookAhead=duckSize()*1.9;
      for(let i=0;i<ducks.length;i++)for(let j=i+1;j<ducks.length;j++){
        const a=ducks[i],b=ducks[j],dx=(a.offset||0)-(b.offset||0);
        if(Math.abs(dx)>lookAhead)continue;
        const ay=a.laneY,by=b.laneY,dy=ay-by;
        if(Math.abs(dy)<.105){
          const dir=dy===0?(a.ph<b.ph?-1:1):Math.sign(dy);
          const strength=(1-Math.abs(dy)/.105)*.16;
          a.laneTarget=Math.max(.06,Math.min(.94,a.laneTarget+dir*strength));
          b.laneTarget=Math.max(.06,Math.min(.94,b.laneTarget-dir*strength));
        }
      }
    }
    if(!S.fin&&S.t>=S.T){S.t=S.T;onFinish(leader());}
  }else if(S.st==='celebrate'){
    S.celebrateT=(S.celebrateT||0)+dt;
  }
  const s=duckSize(),B=bank(),yMin=B+s*.4,yMax=H-s*.62,n=ducks.length;
  const X0=W*.2,rows=ducks.map(k=>{
    const lane=Number.isFinite(k.laneY)?k.laneY:(k.slot+.5)/Math.max(1,n);
    const swimBob=Math.sin(S.t*(3.1+(k.paceWave||1))+k.ph)*s*.025;
    const y=yMin+lane*(yMax-yMin)+swimBob;
    return{k,y,x:X0-SL*(y-B)-s*.5+prog(k)};
  });
  /* Keep the shared world camera and race timing intact while ducks swim independently. */
  S.cam=baseProgress();
  scene(S.cam,now/1000);
  const finishWorld=S.fin?S.finishWorld:D;
  checker(X0,S.cam);checker(X0+finishWorld,S.cam);
  rows.sort((a,b)=>a.y-b.y).forEach(o=>{
    cx.save();cx.strokeStyle='rgba(225,255,255,.48)';cx.lineWidth=1.5;
    const wakeClock=S.fin&&!o.k.win?(S.finishAnimTime||now/1000)*1000:now;
    const pulse=1+Math.sin(wakeClock/190+o.k.ph)*.25;
    cx.beginPath();cx.ellipse(o.x-S.cam,o.y+s*.48,s*.55*pulse,s*.10,0,0,Math.PI*2);cx.stroke();cx.restore();
    const frozenTime=S.fin&&!o.k.win?(S.finishAnimTime||now/1000):now/1000;
    drawDuck(o.k,o.x-S.cam,o.y,s,frozenTime);
    if(S.fin&&o.k.win)drawWinnerCrown(o.x-S.cam,o.y-s*.68,s,S.celebrateT||0);
    if(S.st==='run'&&o.k.mode==='boost')drawBoostEffect(o.k,o.x-S.cam,o.y,s,now/1000);
    if(S.st==='run'&&o.k.mode==='tired')drawFatigueEffect(o.k,o.x-S.cam,o.y,s,now/1000);
  });
  $('clk').textContent=hms(S.T-S.t);
  requestAnimationFrame(frame);
}
/* ---------- race control ---------- */
function reset(){
  // Leave a performance buffer before the finish line so the fastest duck reaches it at timer zero.
  D=RACE_SPEED*Math.max(1,cfg.T)+Math.max(120,W*.62);
  const n=roster.length,slots=[...Array(n).keys()].sort(()=>Math.random()-.5);
  ducks=roster.map((r,i)=>{
    const profiles=['sprinter','late','wild','steady'];
    return{
      r,slot:slots[i],ph:Math.random()*6.28,offset:0,mode:'normal',modeLeft:0,
      eventIn:1.5+Math.random()*7,
      fx:'',
      // Different natural racing styles; no two ducks share the same pace or swim rhythm.
      profile:profiles[Math.floor(Math.random()*profiles.length)],
      basePace:.91+Math.random()*.18,
      paceWave:.55+Math.random()*.65,
      paceSwing:.025+Math.random()*.045,
      stamina:.72+Math.random()*.28,
      laneY:.07+Math.random()*.86,
      laneTarget:.07+Math.random()*.86,
      laneChangeIn:1+Math.random()*3
    };
  });
  const sceneOrder=[0,1,2,3,4].sort(()=>Math.random()-.5);
  S={st:'idle',t:0,T:cfg.T,sc:1,cam:0,last:performance.now(),fin:false,sceneOrder,celebrateT:0,finishWorld:D,finishAnimTime:0};
  ducks.forEach(k=>k.fin=cfg.T);ducks.forEach(k=>k.win=false);order()[0].win=true;
  $('bGo').textContent='▶ START';$('again').classList.add('hide');$('trophy').classList.add('hide');
  $('clk').textContent=hms(S.T);stopMus();if(aud)aud.currentTime=0;
  rmWin=false;$('rm').classList.remove('on');$('rm').textContent='✕';
}
const order=()=>ducks.slice().sort((a,b)=>a.fin-b.fin);
function onFinish(winner=leader()){
  if(S.fin)return;
  S.finishWorld=D;
  S.fin=true;S.st='celebrate';S.celebrateT=0;S.finishAnimTime=performance.now()/1000;
  ducks.forEach(k=>{k.win=k===winner;k.mode='normal';k.fx='';k.fin=k===winner?0:Math.max(1,S.T-(k.offset||0)/RACE_SPEED)});
  $('bGo').textContent='🏆 WINNER';
  $('again').classList.remove('hide');$('trophy').classList.remove('hide');
  if(bellOn)bell();
  const w=winner.r.label;
  $('winT').textContent='🏆 ผู้ชนะ: '+(/^\d+$/.test(w)?'เป็ดหมายเลข ':'')+w;
  $('list').innerHTML='';
  order().forEach((k,i)=>{const d=document.createElement('div');d.innerHTML='<b>'+(i+1)+'</b><span></span><span>'+hms(Math.min(k.fin,99*3600)).slice(0)+'</span>';d.children[1].textContent=k.r.label;$('list').appendChild(d)});
}
$('bGo').onclick=()=>{
  if(S.fin)return;
  if(S.st==='run'){S.st='paused';$('bGo').textContent='▶ RESUME';if(aud)aud.pause()}
  else{S.st='run';$('bGo').textContent='Ⅱ PAUSE';ac();if(musOn)startMus()}
};
$('bClr').onclick=()=>{reset();$('bGo').textContent='▶ START'};
$('bSkip').onclick=()=>{if(!S.fin){S.t=S.T;onFinish()}};
$('bShuf').onclick=()=>assignCo(roster);
$('rm').onclick=()=>{rmWin=!rmWin;$('rm').classList.toggle('on',rmWin);$('rm').textContent=rmWin?'✓':'✕'};
$('bAgain').onclick=()=>{
  if(rmWin){const w=order()[0].r;roster=roster.filter(r=>r!==w)}
  if(roster.length<2){alert('เหลือเป็ดไม่ถึง 2 ตัว กรุณาตั้งค่าใหม่');openSet();return}
  reset();S.st='run';$('bGo').textContent='Ⅱ PAUSE';if(musOn)startMus();
};
$('trophy').onclick=()=>$('resM').classList.remove('hide');
$('resX').onclick=()=>$('resM').classList.add('hide');

/* ---------- sound ---------- */
let AC=null;const ac=()=>{if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume()};
function tone(f,d,type,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function bell(){ac();tone(880,1.2,'sine',.3);setTimeout(()=>tone(1320,1.4,'sine',.25),180)}
let mt=null,mi=0,aud=null;
const ROOT=[130.8,98,110,87.3],LEAD=[[523,659,784,659,523,659,784,1047],[494,587,784,587,494,587,784,988],[440,523,659,523,440,523,659,880],[349,440,523,440,349,440,523,698]];
function stopMus(){clearInterval(mt);if(aud)aud.pause()}
function startMus(){
  if(MUSIC_URL){if(!aud){aud=new Audio(MUSIC_URL);aud.loop=true;aud.volume=.6}aud.play().catch(()=>{});return}
  ac();if(!AC)return;
  mt=setInterval(()=>{if(S.st!=='run')return;const bar=Math.floor(mi/8)%4,n=mi%8;
    tone(ROOT[bar]*(n%4===2?2:1),.17,'triangle',.12);tone(LEAD[bar][n],.15,'square',.035);if(n%2)tone(6000,.03,'square',.012);mi++},190)}
$('bMus').onclick=()=>{musOn=!musOn;$('bMus').textContent=musOn?'♫ ON':'♫ OFF';if(!musOn)stopMus();};
$('bBell').onclick=()=>{bellOn=!bellOn;$('bBell').textContent=bellOn?'🔔 ON':'🔔 OFF';ac();if(bellOn)tone(880,.4,'sine',.15)};

/* ---------- settings ---------- */
let cfg={T:30};
function setMode(m){mode=m;$('tN').classList.toggle('on',m==='num');$('tM').classList.toggle('on',m==='names');$('pN').classList.toggle('hide',m!=='num');$('pM').classList.toggle('hide',m!=='names')}
$('tN').onclick=()=>setMode('num');$('tM').onclick=()=>setMode('names');
const clampN=v=>Math.max(2,Math.min(MAXN,Math.round(+v)||2));
$('rng').oninput=e=>$('cnt').value=e.target.value;
$('cnt').onchange=e=>{e.target.value=clampN(e.target.value);$('rng').value=e.target.value};
const getNames=()=>$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
$('names').oninput=()=>{const n=getNames().length;$('nh').textContent=n+' รายชื่อ'+(n>MAXN?' (ใช้เฉพาะ '+MAXN+' รายชื่อแรก)':n<2?' (ต้องมีอย่างน้อย 2)':'')};
[[10,'10 วิ'],[30,'30 วิ'],[60,'1 นาที'],[300,'5 นาที'],[600,'10 นาที'],[1800,'30 นาที'],[3600,'1 ชั่วโมง']].forEach(([t,l])=>{
  const b=document.createElement('button');b.className='chip';b.textContent=l;
  b.onclick=()=>{$('th').value=Math.floor(t/3600);$('tmn').value=Math.floor(t%3600/60);$('ts').value=t%60};$('chips').appendChild(b)});
function openSet(){$('setM').classList.remove('hide')}
function closeSet(){if(root.classList.contains('is-setup'))return;$('setM').classList.add('hide')}
$('bSet').onclick=openSet;
$('setX').onclick=closeSet;
$('save').onclick=()=>{
  const T=Math.round((+$('th').value||0)*3600+(+$('tmn').value||0)*60+(+$('ts').value||0));
  if(T<1){alert('กรุณาตั้งเวลาอย่างน้อย 1 วินาที');return}
  if(T>99*3600+3599){alert('เวลามากสุด 99 ชั่วโมง');return}
  let labels;
  if(mode==='num')labels=Array.from({length:clampN($('cnt').value)},(_,i)=>String(i+1));
  else{labels=getNames().slice(0,MAXN);if(labels.length<2){alert('กรุณากรอกรายชื่ออย่างน้อย 2 รายชื่อ');return}}
  cfg={T};roster=labels.map(l=>({label:l}));assignCo(roster);
  $('setM').classList.add('hide');root.classList.remove('is-setup');reset();
};
size();roster=Array.from({length:10},(_,i)=>({label:String(i+1)}));assignCo(roster);reset();
requestAnimationFrame(frame);

})();
